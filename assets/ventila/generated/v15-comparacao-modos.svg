<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d"><title id="t">V15 — PSV × VCV × PCV</title><desc id="d">Tabela visual comparando disparo, variável garantida, variável livre, curva típica e risco silencioso dos três modos.</desc><style>text{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:38px;font-weight:700}.p{font-size:24px;font-weight:700}.s{font-size:19px}.cell{fill:#F4EFE4;stroke:#D7CCB8;stroke-width:3}.head{fill:#EBE3D3}.wave{fill:none;stroke:#2E6E8E;stroke-width:7}.ok{stroke:#4E7C5A;stroke-width:8}.free{stroke:#B0503E;stroke-width:8;stroke-dasharray:14 10}</style><rect width="1448" height="1086" fill="#F4EFE4"/><text x="70" y="70" class="h">Três modos, três contratos causais</text><g transform="translate(70 120)"><rect class="cell head" width="300" height="100"/><rect class="cell head" x="300" width="330" height="100"/><rect class="cell head" x="630" width="330" height="100"/><rect class="cell head" x="960" width="330" height="100"/><text x="25" y="60" class="p">Pergunta</text><text x="410" y="60" class="p">PSV</text><text x="740" y="60" class="p">VCV</text><text x="1070" y="60" class="p">PCV</text><g class="s"><rect class="cell" y="100" width="300" height="120"/><rect class="cell" x="300" y="100" width="330" height="120"/><rect class="cell" x="630" y="100" width="330" height="120"/><rect class="cell" x="960" y="100" width="330" height="120"/><text x="25" y="170">Quem dispara?</text><text x="390" y="170">paciente</text><text x="720" y="170">máquina/paciente</text><text x="1050" y="170">máquina/paciente</text><rect class="cell" y="220" width="300" height="120"/><rect class="cell" x="300" y="220" width="330" height="120"/><rect class="cell" x="630" y="220" width="330" height="120"/><rect class="cell" x="960" y="220" width="330" height="120"/><text x="25" y="290">O que garante?</text><text x="390" y="290">ΔP de suporte</text><text x="720" y="290">VT / fluxo</text><text x="1050" y="290">pressão / Ti</text><rect class="cell" y="340" width="300" height="120"/><rect class="cell" x="300" y="340" width="330" height="120"/><rect class="cell" x="630" y="340" width="330" height="120"/><rect class="cell" x="960" y="340" width="330" height="120"/><text x="25" y="410">O que varia?</text><text x="390" y="410">VT e Ti</text><text x="720" y="410">pressão</text><text x="1050" y="410">VT e fluxo</text><rect class="cell" y="460" width="300" height="150"/><rect class="cell" x="300" y="460" width="330" height="150"/><rect class="cell" x="630" y="460" width="330" height="150"/><rect class="cell" x="960" y="460" width="330" height="150"/><text x="25" y="545">Curva típica</text><path d="M340 560 Q430 480 570 560" class="wave"/><path d="M670 560 H900" class="wave"/><path d="M1000 560 Q1120 480 1250 560" class="wave"/><rect class="cell" y="610" width="300" height="130"/><rect class="cell" x="300" y="610" width="330" height="130"/><rect class="cell" x="630" y="610" width="330" height="130"/><rect class="cell" x="960" y="610" width="330" height="130"/><text x="25" y="685">Risco silencioso</text><text x="355" y="685">trabalho excessivo</text><text x="690" y="685">pressão excessiva</text><text x="1020" y="685">VT insuficiente</text></g><rect x="0" y="770" width="1290" height="150" rx="22" fill="#EBE3D3" stroke="#D7CCB8" stroke-width="3"/><text x="25" y="820" class="p">Mesma queda de complacência</text><path d="M330 865 H560" class="free"/><path d="M690 865 H920" class="free"/><path d="M1020 865 H1250" class="free"/><text x="340" y="905" class="s">PSV: VT cai / esforço sobe</text><text x="700" y="905" class="s">VCV: pressão sobe</text><text x="1030" y="905" class="s">PCV: VT cai</text></g></svg>