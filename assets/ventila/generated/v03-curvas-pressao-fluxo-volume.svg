<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d"><title id="t">V03 — Curvas de pressão, fluxo e volume</title><desc id="d">Três curvas alinhadas no tempo e exemplo de fluxo expiratório que não retorna a zero antes do ciclo seguinte.</desc><style>text{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:38px;font-weight:700}.p{font-size:24px;font-weight:700}.s{font-size:20px}.grid{stroke:#D7CCB8;stroke-width:2}.axis{stroke:#16383B;stroke-width:4}.wave{fill:none;stroke:#2E6E8E;stroke-width:8}.warn{fill:none;stroke:#B0503E;stroke-width:8}.fill{fill:#3C7F86;opacity:.12}</style><rect width="1448" height="1086" fill="#F4EFE4"/><text x="70" y="72" class="h">A mesma respiração em três linguagens</text><g transform="translate(90 130)"><text x="0" y="38" class="p">Pressão</text><path d="M150 50 V230 H1270" class="axis"/><path d="M150 210 H1270 M150 150 H1270 M150 90 H1270" class="grid"/><path d="M150 210 L210 210 L230 100 L460 100 L480 210 L600 210 L620 100 L850 100 L870 210 L990 210 L1010 100 L1240 100 L1260 210" class="wave"/></g><g transform="translate(90 400)"><text x="0" y="38" class="p">Fluxo</text><path d="M150 50 V230 H1270" class="axis"/><path d="M150 140 H1270" class="grid"/><path d="M150 140 L210 140 L210 70 L460 70 L460 140 Q500 220 600 140 L620 140 L620 70 L850 70 L850 140 Q910 225 990 140 L1010 140 L1010 70 L1240 70 L1240 140 Q1280 220 1270 140" class="wave"/></g><g transform="translate(90 670)"><text x="0" y="38" class="p">Volume</text><path d="M150 50 V230 H1270" class="axis"/><path d="M150 220 H1270" class="grid"/><path d="M150 220 L210 220 Q330 80 460 80 Q540 110 600 220 L620 220 Q740 80 850 80 Q930 110 990 220 L1010 220 Q1130 80 1240 80 Q1270 110 1270 220" class="wave"/></g><g transform="translate(920 920)"><path d="M0 0 H360" class="axis"/><path d="M0 0 Q90 110 210 55 L300 20" class="warn"/><text x="0" y="88" class="s">fluxo expiratório não zera → auto-PEEP</text></g></svg>