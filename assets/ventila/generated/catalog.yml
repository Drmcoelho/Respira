assets:
  - id: HEX-VENT-V01-PLATE
    module: V01
    title: Indicacao e falha do suporte ventilatorio
    status: completed
    file: v01-indicacao-e-falha.svg
    kind: original_vector_plate
    alt_text: Prancha em tres colunas mostrando desequilibrio entre demanda e capacidade respiratoria, escalada do suporte e criterios clinicos de falha.
    learning_objectives:
      - reconhecer indicacao pela relacao demanda-capacidade
      - estabelecer meta, janela de resposta e criterio de falha
      - reconhecer falha como tendencia clinica convergente
    canonical_prompt: >-
      Flat vector medical infographic, 4:3 landscape, ivory background, CODEX.md clinical palette (marfim, azul de comando, terracota de esforço, verde-grafite). Three-column causal storyboard: respiratory demand exceeding patient capacity; rational escalation from oxygen to noninvasive support to invasive ventilation; failure recognized through rising work of breathing, absent gas-exchange response, instability and declining consciousness. Anonymous schematic lungs, clean line icons, no realistic face, no radiography, concise Portuguese labels added deterministically, strong visual hierarchy and clinically exact relationships.
    linked_modules: [V01, V08, V12]
    commit: 6f53f1f085da80ece82c676ce7d8be50f2de12a1
