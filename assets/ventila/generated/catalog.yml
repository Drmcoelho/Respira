      Flat vector medical infographic, 4:3 landscape, white background, Hexapode clinical palette in petrol blue, amber and graphite. Three-column causal storyboard: respiratory demand exceeding patient capacity; rational escalation from oxygen to noninvasive support to invasive ventilation; failure recognized through rising work of breathing, absent gas-exchange response, instability and declining consciousness. Anonymous schematic lungs, clean line icons, no realistic face, no radiography, concise Portuguese labels added deterministically, strong visual hierarchy and clinically exact relationships.
