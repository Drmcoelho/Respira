<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">Modos espontâneos: PSV, CPAP e SIMV</title>
<desc id="desc">Prancha comparativa mostrando quem inicia, limita e encerra o ciclo em PSV, CPAP e SIMV, além do efeito do esforço do paciente sobre pressão, fluxo e volume.</desc>
<defs><style>
.t{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:44px;font-weight:700}.s{font-size:25px;font-weight:700}.b{font-size:20px}.sm{font-size:17px}.card{fill:#F4EFE4;stroke:#2E6E8E;stroke-width:4}.soft{fill:#F4EFE4}.amber{fill:#F4EFE45d9;stroke:#C0603A;stroke-width:3}.line{fill:none;stroke:#2E6E8E;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.patient{fill:none;stroke:#C0603A;stroke-width:6;stroke-linecap:round}.axis{stroke:#16383B;stroke-width:2}.dash{fill:none;stroke:#16383B;stroke-width:3;stroke-dasharray:10 8}.tag{fill:#2E6E8E}.white{fill:#fff}.warn{fill:#C0603A}.thin{fill:none;stroke:#2E6E8E;stroke-width:3}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E6E8E"/></marker></defs>
<rect width="1448" height="1086" fill="#F4EFE4"/><text x="72" y="80" class="t h">V08 — Quem respira, quem ajuda, quem garante?</text><text x="72" y="118" class="t b">A variável decisiva é a divisão do trabalho entre paciente e ventilador.</text>
<g transform="translate(70 160)"><rect class="card" width="402" height="620" rx="26"/><rect class="tag" width="402" height="74" rx="26"/><text x="28" y="48" class="white s">PSV</text><text x="28" y="112" class="t s">Paciente inicia e termina</text>
<circle cx="92" cy="196" r="42" fill="#F4EFE45d9" stroke="#C0603A" stroke-width="4"/><path d="M74 194 q18-28 36 0" class="patient"/><path d="M92 238 v52" class="patient"/><path d="M92 260 l-34 28 M92 260 l34 28" class="patient"/>
<rect x="220" y="160" width="120" height="90" rx="14" class="soft" stroke="#2E6E8E" stroke-width="4"/><text x="241" y="198" class="t sm">PRESSÃO</text><text x="249" y="225" class="t sm">DE APOIO</text><path d="M142 205 H214" class="line" marker-end="url(#arr)"/>
<text x="30" y="330" class="t b">Trigger:</text><text x="125" y="330" class="t b">esforço do paciente</text><text x="30" y="365" class="t b">Limite:</text><text x="125" y="365" class="t b">pressão</text><text x="30" y="400" class="t b">Ciclagem:</text><text x="125" y="400" class="t b">queda do fluxo</text>
<line x1="38" y1="468" x2="360" y2="468" class="axis"/><line x1="38" y1="468" x2="38" y2="430" class="axis"/><path d="M40 468 C74 430,110 423,146 438 S235 469,356 468" class="line"/><path d="M40 468 C68 453,94 448,126 451" class="patient"/><text x="38" y="510" class="t sm">mais esforço → mais fluxo e volume</text><rect x="28" y="540" width="346" height="54" rx="12" class="amber"/><text x="46" y="574" class="t sm">Suporte variável; ventilação não garantida.</text></g>
<g transform="translate(523 160)"><rect class="card" width="402" height="620" rx="26"/><rect class="tag" width="402" height="74" rx="26"/><text x="28" y="48" class="white s">CPAP</text><text x="28" y="112" class="t s">Paciente faz todo o ciclo</text>
<circle cx="92" cy="196" r="42" fill="#F4EFE45d9" stroke="#C0603A" stroke-width="4"/><path d="M74 194 q18-28 36 0" class="patient"/><path d="M92 238 v52" class="patient"/><path d="M92 260 l-34 28 M92 260 l34 28" class="patient"/>
<rect x="220" y="160" width="120" height="90" rx="14" class="soft" stroke="#2E6E8E" stroke-width="4"/><text x="245" y="198" class="t sm">PEEP</text><text x="235" y="225" class="t sm">CONTÍNUA</text><path d="M142 205 H214" class="line" marker-end="url(#arr)"/>
<text x="30" y="330" class="t b">Trigger:</text><text x="125" y="330" class="t b">paciente</text><text x="30" y="365" class="t b">Pressão:</text><text x="125" y="365" class="t b">basal contínua</text><text x="30" y="400" class="t b">Volume:</text><text x="125" y="400" class="t b">inteiramente espontâneo</text>
<line x1="38" y1="468" x2="360" y2="468" class="axis"/><path d="M40 450 C90 430,132 470,184 450 S280 430,356 450" class="patient"/><path d="M40 430 H356" class="dash"/><text x="38" y="510" class="t sm">linha basal elevada mantém recrutamento</text><rect x="28" y="540" width="346" height="54" rx="12" class="amber"/><text x="51" y="574" class="t sm">Não fornece pressão inspiratória adicional.</text></g>
<g transform="translate(976 160)"><rect class="card" width="402" height="620" rx="26"/><rect class="tag" width="402" height="74" rx="26"/><text x="28" y="48" class="white s">SIMV</text><text x="28" y="112" class="t s">Mandatórios + espontâneos</text>
<g transform="translate(28 150)"><rect width="346" height="82" rx="14" class="soft" stroke="#2E6E8E" stroke-width="3"/><circle cx="52" cy="41" r="22" class="tag"/><text x="43" y="48" class="white sm">M</text><circle cx="138" cy="41" r="22" fill="#C0603A"/><text x="130" y="48" class="t sm">E</text><circle cx="224" cy="41" r="22" class="tag"/><text x="215" y="48" class="white sm">M</text><circle cx="310" cy="41" r="22" fill="#C0603A"/><text x="302" y="48" class="t sm">E</text></g>
<text x="30" y="280" class="t b">M:</text><text x="70" y="280" class="t b">ciclo mandatório sincronizado</text><text x="30" y="315" class="t b">E:</text><text x="70" y="315" class="t b">ciclo espontâneo, com ou sem PSV</text><text x="30" y="365" class="t b">Frequência mínima protegida</text><text x="30" y="400" class="t b">Trabalho respiratório pode variar muito</text>
<line x1="38" y1="468" x2="360" y2="468" class="axis"/><path d="M42 468 L58 405 L76 468 M120 468 C150 440 178 442 206 468 M238 468 L254 405 L272 468 M306 468 C324 452 342 450 358 468" class="line"/><text x="38" y="510" class="t sm">mistura exige leitura ciclo a ciclo</text><rect x="28" y="540" width="346" height="54" rx="12" class="amber"/><text x="47" y="574" class="t sm">O nome do modo não mede o esforço real.</text></g>
<g transform="translate(70 820)"><rect width="1308" height="186" rx="24" class="soft"/><text x="28" y="46" class="t s">Regra de leitura</text><text x="28" y="84" class="t b">1. Quem dispara?  2. Qual variável é limitada?  3. Quem cicla?  4. O que muda quando o esforço muda?</text><path d="M40 132 H1260" class="thin" marker-end="url(#arr)"/><text x="40" y="164" class="t sm">Quanto maior a participação do paciente, menor a previsibilidade do volume e maior a necessidade de observar esforço, sincronia e tendência.</text></g>
</svg>