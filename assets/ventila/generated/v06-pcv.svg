<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d"><title id="t">V06 — PCV por dentro</title><desc id="d">Comparação vetorial do volume resultante no PCV em pulmão normal, complacência baixa e resistência elevada.</desc><style>text{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:38px;font-weight:700}.p{font-size:24px;font-weight:700}.s{font-size:20px}.box{fill:#F4EFE4;stroke:#D7CCB8;stroke-width:3}.axis{stroke:#16383B;stroke-width:4}.set{stroke:#4E7C5A;stroke-width:9;fill:none}.warn{stroke:#B8862F;stroke-width:9;fill:none}.bad{stroke:#B0503E;stroke-width:9;fill:none}.lung{fill:#EBE3D3;stroke:#16383B;stroke-width:5}</style><rect width="1448" height="1086" fill="#F4EFE4"/><text x="72" y="72" class="h">PCV: a pressão é a promessa; o volume pode desaparecer</text><g transform="translate(55 130)"><rect class="box" width="250" height="820" rx="22"/><text x="24" y="52" class="p">1 · Ajustado</text><path d="M35 210 H210" class="set"/><path d="M35 330 H210" class="set"/><text x="38" y="260" class="s">pressão fixa</text><text x="38" y="380" class="s">Ti fixo</text></g><g transform="translate(325 130)"><rect class="box" width="250" height="820" rx="22"/><text x="24" y="52" class="p">2 · Normal</text><path d="M35 430 H215" class="axis"/><path d="M45 430 Q95 210 180 430" class="set"/><text x="38" y="500" class="s">VT adequado</text><path d="M70 570 C30 630 55 740 120 770 C185 740 210 630 170 570Z" class="lung"/></g><g transform="translate(595 130)"><rect class="box" width="250" height="820" rx="22"/><text x="24" y="52" class="p">3 · C baixa</text><path d="M35 430 H215" class="axis"/><path d="M45 430 Q95 330 180 430" class="bad"/><text x="38" y="500" class="s">mesma pressão</text><text x="38" y="535" class="p">VT ↓</text></g><g transform="translate(865 130)"><rect class="box" width="250" height="820" rx="22"/><text x="24" y="52" class="p">4 · τ alta</text><path d="M35 430 H215" class="axis"/><path d="M45 430 Q150 250 210 270" class="warn"/><path d="M210 190 V470" stroke="#16383B" stroke-width="5" stroke-dasharray="12 8"/><text x="38" y="500" class="s">enchimento não</text><text x="38" y="535" class="s">termina no Ti</text></g><g transform="translate(1135 130)"><rect class="box" width="250" height="820" rx="22"/><text x="24" y="52" class="p">5 · Vigiar</text><circle cx="125" cy="250" r="74" fill="#B0503E" opacity=".18"/><path d="M125 185 V260" stroke="#B0503E" stroke-width="16"/><circle cx="125" cy="300" r="9" fill="#B0503E"/><text x="38" y="390" class="s">variável livre:</text><text x="38" y="430" class="p">volume</text><text x="38" y="520" class="s">VT + VE</text><text x="38" y="555" class="s">sempre visíveis</text></g></svg>