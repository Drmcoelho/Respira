<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc"><title id="title">PRVC e controle adaptativo</title><desc id="desc">Prancha sobre ajuste de pressão entre ciclos para alcançar volume-alvo e influência do esforço espontâneo.</desc><rect width="1448" height="1086" fill="#F4EFE4"/><style>.t{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:44px;font-weight:700}.s{font-size:24px}.l{font-size:20px}.b{fill:#F4EFE4;stroke:#2E6E8E;stroke-width:3}.w{fill:#F4EFE47df;stroke:#C0603A;stroke-width:3}.p{stroke:#2E6E8E;stroke-width:8;fill:none}.a{stroke:#C0603A;stroke-width:7;fill:none}.g{stroke:#16383B;stroke-width:4;fill:none}</style><text x="75" y="82" class="t h">V07 — PRVC: controle adaptativo ciclo a ciclo</text><text x="75" y="124" class="t s">O ventilador compara o volume expirado com o alvo e reajusta a pressão do ciclo seguinte.</text><rect x="60" y="165" width="1328" height="220" rx="24" class="b"/><text x="95" y="215" class="t s">Laço de controle</text><rect x="100" y="260" width="210" height="75" rx="14" fill="#F4EFE4" stroke="#16383B" stroke-width="3"/><text x="145" y="305" class="t l">Volume-alvo</text><rect x="420" y="260" width="210" height="75" rx="14" fill="#F4EFE4" stroke="#16383B" stroke-width="3"/><text x="462" y="305" class="t l">Controlador</text><rect x="740" y="260" width="220" height="75" rx="14" fill="#F4EFE4" stroke="#16383B" stroke-width="3"/><text x="785" y="305" class="t l">Pressão aplicada</text><rect x="1070" y="260" width="220" height="75" rx="14" fill="#F4EFE4" stroke="#16383B" stroke-width="3"/><text x="1115" y="305" class="t l">Volume medido</text><path d="M310 298H420M630 298H740M960 298H1070" class="p"/><path d="M1180 335V365H525V335" class="a"/><text x="690" y="358" class="t l">feedback entre ciclos</text><rect x="60" y="425" width="850" height="420" rx="24" class="b"/><text x="95" y="475" class="t s">Adaptação da pressão</text><line x1="120" y1="760" x2="850" y2="760" class="g"/><line x1="100" y1="535" x2="850" y2="535" class="a" stroke-dasharray="12 10"/><text x="650" y="520" class="t l">volume-alvo</text><path d="M120 760V650H250V760" class="p"/><path d="M310 760V605H440V760" class="p"/><path d="M500 760V550H630V760" class="p"/><path d="M690 760V565H820V760" class="p"/><text x="145" y="805" class="t l">pressão baixa</text><text x="335" y="805" class="t l">pressão sobe</text><text x="525" y="805" class="t l">alvo próximo</text><text x="710" y="805" class="t l">ajuste fino</text><rect x="950" y="425" width="438" height="420" rx="24" class="w"/><text x="985" y="475" class="t s">Interferência do esforço</text><text x="985" y="535" class="t l">Esforço do paciente aumenta</text><path d="M1000 585C1050 525 1110 645 1160 585C1210 525 1270 645 1320 585" class="a"/><text x="985" y="655" class="t l">Volume medido aumenta</text><text x="985" y="705" class="t l">O controlador reduz pressão</text><path d="M1000 750H1315" class="p"/><text x="985" y="805" class="t l">Interpretar com drive e sincronia</text><rect x="80" y="900" width="1288" height="120" rx="18" class="w"/><text x="110" y="945" class="t s">Regra mental:</text><text x="285" y="945" class="t l">o PRVC busca o volume médio ajustando pressão entre ciclos; não garante o mesmo volume em cada ciclo.</text><text x="110" y="985" class="t l">Volume, pressão, esforço e limites de segurança precisam ser lidos em conjunto.</text></svg>