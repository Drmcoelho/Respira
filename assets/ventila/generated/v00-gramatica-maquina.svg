<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d"><title id="t">V00 — Gramática da máquina</title><desc id="d">Prancha vetorial em cinco painéis mostrando ventilador, resistência, complacência, fluxo, volume e comparação entre VCV e PCV.</desc><style>text{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:38px;font-weight:700}.p{font-size:24px;font-weight:700}.s{font-size:20px}.box{fill:#F4EFE4;stroke:#D7CCB8;stroke-width:3}.machine{fill:#2E6E8E}.gas{stroke:#3C7F86;stroke-width:12;fill:none}.cost{stroke:#C0603A;stroke-width:12;fill:none}.ok{stroke:#4E7C5A;stroke-width:10;fill:none}.bad{stroke:#B0503E;stroke-width:10;fill:none}.lung{fill:#EBE3D3;stroke:#16383B;stroke-width:5}.wave{fill:none;stroke:#2E6E8E;stroke-width:7}.free{stroke-dasharray:18 12}</style><rect width="1448" height="1086" fill="#F4EFE4"/><text x="72" y="72" class="h">Todo modo é um contrato</text><g transform="translate(60 120)"><rect class="box" width="250" height="820" rx="24"/><text x="24" y="54" class="p">1 · Sistema</text><rect x="32" y="110" width="82" height="130" rx="12" class="machine"/><circle cx="73" cy="150" r="18" fill="#F4EFE4"/><path d="M114 175 C150 175 155 260 185 300" class="gas"/><path d="M185 300 C145 340 140 450 180 505 C220 450 215 340 185 300Z" class="lung"/><text x="28" y="590" class="s">máquina → circuito</text><text x="28" y="620" class="s">→ pulmão</text></g><g transform="translate(330 120)"><rect class="box" width="250" height="820" rx="24"/><text x="24" y="54" class="p">2 · Custo</text><path d="M38 180 H205" class="cost"/><path d="M55 300 C90 240 140 240 190 300" class="cost"/><path d="M55 430 C105 500 145 500 195 430" class="cost"/><text x="30" y="560" class="s">Pressão vence:</text><text x="30" y="600" class="s">R + E + PEEP</text></g><g transform="translate(600 120)"><rect class="box" width="250" height="820" rx="24"/><text x="24" y="54" class="p">3 · Fluxo</text><path d="M30 430 H220" stroke="#16383B" stroke-width="3"/><path d="M35 420 L35 220 H155 V420 Q200 520 220 430" class="wave"/><text x="30" y="560" class="s">∫ fluxo · dt = V</text><path d="M35 650 C90 610 140 610 210 650" class="ok"/></g><g transform="translate(870 120)"><rect class="box" width="250" height="820" rx="24"/><text x="24" y="54" class="p">4 · Tempo</text><rect x="35" y="190" width="120" height="140" fill="#2E6E8E" opacity=".25"/><rect x="155" y="190" width="60" height="140" fill="#3C7F86" opacity=".25"/><text x="62" y="270" class="p">Ti</text><text x="167" y="270" class="p">Te</text><path d="M35 410 H215" stroke="#16383B" stroke-width="5"/><path d="M35 410 V380 M155 410 V380 M215 410 V380" stroke="#16383B" stroke-width="5"/><text x="34" y="560" class="s">janelas terapêuticas</text></g><g transform="translate(1140 120)"><rect class="box" width="250" height="820" rx="24"/><text x="24" y="54" class="p">5 · Contrato</text><rect x="28" y="140" width="194" height="210" rx="18" fill="#EBE3D3"/><text x="48" y="185" class="p">VCV</text><path d="M48 250 H190" class="ok"/><path d="M48 300 H190" class="bad free"/><text x="48" y="385" class="s">V garantido</text><text x="48" y="415" class="s">P livre</text><rect x="28" y="500" width="194" height="210" rx="18" fill="#EBE3D3"/><text x="48" y="545" class="p">PCV</text><path d="M48 610 H190" class="ok"/><path d="M48 660 H190" class="bad free"/><text x="48" y="745" class="s">P garantida</text><text x="48" y="775" class="s">V livre</text></g></svg>