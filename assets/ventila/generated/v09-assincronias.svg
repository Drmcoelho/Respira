<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">Assincronias paciente–ventilador</title>
<desc id="desc">Prancha comparando traçado neural e traçado do ventilador em cinco assincronias: esforço ineficaz, auto-trigger, duplo disparo, fome de fluxo e ciclagem tardia.</desc>
<defs><style>
.t{font-family:Arial,sans-serif;fill:#16383B}.h{font-size:44px;font-weight:700}.s{font-size:24px;font-weight:700}.b{font-size:19px}.sm{font-size:16px}.card{fill:#F4EFE4;stroke:#2E6E8E;stroke-width:3}.soft{fill:#F4EFE4}.amber{fill:#F4EFE45d9;stroke:#C0603A;stroke-width:3}.axis{stroke:#16383B;stroke-width:2}.neural{fill:none;stroke:#C0603A;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.vent{fill:none;stroke:#2E6E8E;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#16383B;stroke-width:2;stroke-dasharray:9 7}.tag{fill:#2E6E8E}.white{fill:#fff}.bad{fill:#C0603A}.arrow{stroke:#16383B;stroke-width:3;marker-end:url(#arr)}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16383B"/></marker></defs>
<rect width="1448" height="1086" fill="#F4EFE4"/><text x="70" y="78" class="t h">V09 — Assincronia é desencontro de intenção e entrega</text><text x="70" y="116" class="t b">Leia sempre duas histórias: esforço neural do paciente e resposta mecânica do ventilador.</text>
<g transform="translate(70 148)"><rect width="1308" height="86" rx="20" class="soft"/><path d="M34 47 C62 10 88 10 116 47 S170 84 198 47" class="neural"/><text x="220" y="54" class="t b">Esforço neural</text><path d="M430 47 L455 18 L480 18 L505 47 L530 47" class="vent"/><text x="552" y="54" class="t b">Pressão/fluxo entregue</text><text x="850" y="54" class="t b">O diagnóstico nasce da relação temporal entre ambos.</text></g>
<g transform="translate(70 264)"><rect width="628" height="220" rx="22" class="card"/><rect width="628" height="52" rx="22" class="tag"/><text x="22" y="35" class="white s">1. Esforço ineficaz</text><line x1="30" y1="126" x2="590" y2="126" class="axis"/><path d="M36 126 C72 82 108 84 140 126 M220 126 C254 82 290 84 324 126 M420 126 C454 82 490 84 524 126" class="neural"/><path d="M36 126 L74 126 L92 78 L126 78 L144 126 M420 126 L458 126 L476 78 L510 78 L528 126" class="vent"/><line x1="272" y1="60" x2="272" y2="108" class="arrow"/><text x="304" y="76" class="t sm">há esforço, mas não há ciclo</text><text x="30" y="180" class="t b">Causas: auto-PEEP, trigger pouco sensível, fraqueza.</text></g>
<g transform="translate(750 264)"><rect width="628" height="220" rx="22" class="card"/><rect width="628" height="52" rx="22" class="tag"/><text x="22" y="35" class="white s">2. Auto-trigger</text><line x1="30" y1="126" x2="590" y2="126" class="axis"/><path d="M36 126 C72 84 108 84 140 126 M420 126 C454 84 490 84 524 126" class="neural"/><path d="M36 126 L74 126 L92 78 L126 78 L144 126 M230 126 L250 78 L284 78 L302 126 M420 126 L458 126 L476 78 L510 78 L528 126" class="vent"/><line x1="266" y1="60" x2="266" y2="108" class="arrow"/><text x="304" y="76" class="t sm">ciclo sem esforço neural</text><text x="30" y="180" class="t b">Causas: vazamento, água no circuito, trigger excessivo.</text></g>
<g transform="translate(70 512)"><rect width="628" height="220" rx="22" class="card"/><rect width="628" height="52" rx="22" class="tag"/><text x="22" y="35" class="white s">3. Duplo disparo</text><line x1="30" y1="126" x2="590" y2="126" class="axis"/><path d="M36 126 C80 70 146 70 190 126" class="neural"/><path d="M36 126 L70 126 L88 76 L136 76 L154 126 L174 126 L192 76 L240 76 L258 126" class="vent"/><line x1="176" y1="58" x2="176" y2="108" class="arrow"/><text x="284" y="78" class="t sm">um esforço prolongado gera dois ciclos</text><text x="30" y="180" class="t b">Risco: breath stacking e volume corrente excessivo.</text></g>
<g transform="translate(750 512)"><rect width="628" height="220" rx="22" class="card"/><rect width="628" height="52" rx="22" class="tag"/><text x="22" y="35" class="white s">4. Fome de fluxo</text><line x1="30" y1="126" x2="590" y2="126" class="axis"/><path d="M36 126 C80 70 144 70 190 126" class="neural"/><path d="M36 126 L72 126 L92 92 L118 108 L146 94 L174 108 L198 126" class="vent"/><path d="M90 92 L118 108 L146 94 L174 108" class="dash"/><text x="236" y="82" class="t sm">entrega insuficiente de fluxo</text><text x="30" y="180" class="t b">Sinal: concavidade/queda de pressão durante a inspiração.</text></g>
<g transform="translate(70 760)"><rect width="1308" height="224" rx="22" class="card"/><rect width="1308" height="52" rx="22" class="tag"/><text x="22" y="35" class="white s">5. Ciclagem tardia — o ventilador continua quando o paciente já quer expirar</text><line x1="34" y1="132" x2="1268" y2="132" class="axis"/><path d="M44 132 C98 76 160 76 216 132" class="neural"/><path d="M44 132 L86 132 L108 82 L290 82 L312 132" class="vent"/><line x1="216" y1="64" x2="216" y2="114" class="arrow"/><text x="340" y="92" class="t b">esforço expiratório começa antes do fim da assistência</text><rect x="840" y="76" width="400" height="92" rx="16" class="amber"/><text x="862" y="112" class="t b">Correção depende da causa:</text><text x="862" y="143" class="t sm">ajustar ciclagem, tempo inspiratório, suporte e mecânica.</text><text x="34" y="192" class="t sm">Regra prática: não trate o desenho isolado; confirme contexto, esforço, vazamento, auto-PEEP e configuração do modo.</text></g>
<g transform="translate(70 1010)"><circle cx="12" cy="12" r="10" fill="#C0603A"/><text x="32" y="18" class="t sm">amarelo = intenção do paciente</text><circle cx="270" cy="12" r="10" fill="#2E6E8E"/><text x="290" y="18" class="t sm">petróleo = entrega do ventilador</text></g>
</svg>