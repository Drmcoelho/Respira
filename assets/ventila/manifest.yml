source_registry:
  drive:
    - id: drive-pilbeam-8e
      title: Pilbeams Mechanical Ventilation 8th ed 2024
      file_id: 1UniOn0KVvUA0AapjoWL-3VO7Ip9SQ8FO
      role: private_reference_only
      redistribution: prohibited_without_permission
    - id: drive-pilbeam-6e
      title: Pilbeam's Mechanical Ventilation — Physiological and Clinical Applications, 6e
      file_id: 1cTBZrb8NJ7NX4ermeOBoM-UrATd8pWHJ
      role: private_reference_only
      redistribution: prohibited_without_permission
    - id: drive-mechvent-physiology-practice
      title: Mechanical Ventilation — Physiology and Practice
