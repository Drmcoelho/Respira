      role: private_reference_only
      redistribution: prohibited_without_permission
  open:
    - id: openstax-breathing
      title: OpenStax Anatomy and Physiology — Process of Breathing
      url: https://openstax.org/books/anatomy-and-physiology/pages/22-3-the-process-of-breathing
      license: CC-BY
      use: anatomy_and_mechanics_reference
    - id: openstax-lungs
      title: OpenStax Anatomy and Physiology — The Lungs
      url: https://openstax.org/books/anatomy-and-physiology/pages/22-2-the-lungs
      license: CC-BY
      use: pulmonary_anatomy_reference
    - id: cdc-phil-normal-cxr
      title: CDC PHIL 17298 — normal PA chest radiograph
      url: https://wwwn.cdc.gov/phil/Details.aspx?pid=17298
      license: public_domain
      use: radiology_reference
    - id: cdc-phil-atelectasis
      title: CDC PHIL 6242 — atelectasis and bronchiectasis
      url: https://wwwn.cdc.gov/phil/Details.aspx?pid=6242
      license: public_domain
      use: radiology_reference
    - id: cdc-phil-bronchiectasis
      title: CDC PHIL 23981 — bronchiectasis
      url: https://wwwn.cdc.gov/phil/Details.aspx?pid=23981
      license: public_domain
      use: radiology_reference
    - id: commons-flow-time
      title: Wikimedia Commons — Ventilator waveforms flow-time
      url: https://commons.wikimedia.org/wiki/File:Ventilatorwaveformsflowtime.jpg
      license: verify_on_file_page
      use: waveform_reference_not_final_overlay
    - id: commons-ventilator-circuit
      title: Wikimedia Commons — Biology of ventilation
      url: https://commons.wikimedia.org/wiki/File:Biology_of_ventilation.gif
      license: verify_on_file_page
      use: circuit_and_gas_exchange_reference
    - id: pmc-waveforms
      title: The Basics of Ventilator Waveforms
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7782574/
      license: verify_article_and_figure_specific_terms
      use: scientific_reference_only_unless_figure_license_allows

production_rules:
  final_plate:
    aspect_ratio: '4:3'
    raster_px: [1448, 1086]
    format: webp
  generated_base:
    text: none_or_short_symbols
    final_labels: deterministic_svg_overlay
  curves_loops_formulas:
    method: deterministic_svg_or_canvas
  radiology:
    method: licensed_real_image_or_clearly_schematic_redraw
  private_books:
    method: understand_compare_and_redraw_original

