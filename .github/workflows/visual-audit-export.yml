name: Visual audit export

on:
  push:
    branches:
      - agent/codex-visual-system
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload Respira visual atlas
        uses: actions/upload-artifact@v4
        with:
          name: respira-visual-audit
          path: |
            assets/figuras/*.webp
          if-no-files-found: error
          compression-level: 0
